name: Build and Release ArtaleHUD

on:
  # Automatic Trigger for specific tag formats
  push:
    tags:
      - 'v*'

  # Manual Trigger from the GitHub UI
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Optional note for this manual build'
        required: false
        default: 'Manual build'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        # Running on both Windows and macOS runners
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            target: win
            artifact_name: ArtaleHUD-win.exe
          - os: macos-latest
            target: mac
            artifact_name: ArtaleHUD-mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.1'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Show Build Note
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Build note: ${{ github.event.inputs.release_note }}"
          else
            echo "Build note: Tag build: ${{ github.ref_name }}"
          fi

      - name: Execute Build Script
        run: |
          python setup.py --target_os=${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Create GitHub Release and Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # This will upload the compiled files to the Release page
          # Ensure your setup.py outputs files to the 'dist/' folder
          files: |
            dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
