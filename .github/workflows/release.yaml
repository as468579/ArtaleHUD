name: Build and Release ArtaleHUD

# Trigger the workflow only when a tag starting with 'v' is pushed (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        # Running on both Windows and macOS runners
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            target: win
            artifact_name: ArtaleHUD-Win.exe
          - os: macos-latest
            target: mac
            artifact_name: ArtaleHUD-Mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.1'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Execute Build Script
        run: |
          python setup.py --target_os=${{ matrix.target }}

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          # This will upload the compiled files to the Release page
          # Ensure your setup.py outputs files to the 'dist/' folder
          files: |
            dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
